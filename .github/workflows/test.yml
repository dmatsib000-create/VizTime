name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tests import only the pure modules; this catches a syntax error in
      # any script, which would otherwise ship and stop the app loading.
      - name: Check every script parses
        run: for f in js/*.js sw.js; do node --check "$f" || exit 1; done
      - run: node --test
      # The real page in headless Chrome (already on GitHub's runner), in each
      # mode, failing on any script error. No npm packages: see the file.
      - name: Load the page in each mode
        run: node tests/browser-smoke.mjs
